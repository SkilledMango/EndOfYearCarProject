<script>
        // Formatting for Israeli license plate (typically 7 or 8 digits)
        const plateInput = document.getElementById('plateInput');
        plateInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            let formatted = value;
            
            // Format 7 or 8 digit plates typical in Israel (e.g., 12-345-67 or 123-45-678)
            if (value.length > 7) {
                if (value.length > 2) formatted = value.slice(0,3) + '-' + value.slice(3);
                if (value.length > 5) formatted = formatted.slice(0,6) + '-' + formatted.slice(6);
            } else {
                if (value.length > 2) formatted = value.slice(0,2) + '-' + value.slice(2);
                if (value.length > 5) formatted = formatted.slice(0,6) + '-' + formatted.slice(6);
            }
            
            e.target.value = formatted;
        });

        // Simulate lookup
        const lookupBtn = document.getElementById('lookupBtn');
        const overlay = document.getElementById('overlay');
        const confirmationSheet = document.getElementById('confirmationSheet');

        lookupBtn.addEventListener('click', () => {
            if(plateInput.value.length < 5) return; // Simple validation
            
            // Show loading state on button
            const originalContent = lookupBtn.innerHTML;
            lookupBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Looking up...';
            
            // Simulate network request
            setTimeout(() => {
                lookupBtn.innerHTML = originalContent;
                overlay.style.display = 'block';
                // Trigger reflow
                void overlay.offsetWidth;
                overlay.style.opacity = '1';
                confirmationSheet.classList.add('show');
            }, 800);
        });

        // Close sheet on overlay click
        overlay.addEventListener('click', () => {
            confirmationSheet.classList.remove('show');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        });
    </script>
