<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.05); }
        }
        .scan-progress {
            transition: stroke-dashoffset 0.5s ease;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    </style>

    body {

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full max-w-lg mx-auto pb-24 pt-safe-top px-container-padding flex flex-col items-center">
<!-- Header & Status -->
<header class="w-full mt-lg text-center flex flex-col items-center gap-sm">
<h1 class="text-headline-md font-headline-md text-on-surface">Scanning Toyota Corolla...</h1>
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container border border-surface-variant shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<span class="w-2.5 h-2.5 rounded-full bg-secondary"></span>
<span class="text-label-md font-label-md text-on-surface-variant">OBD-II Connected</span>
</div>
</header>
<!-- Scanning Animation Area -->
<section class="relative w-full aspect-square max-w-[300px] mt-xl mb-lg flex items-center justify-center">
<!-- Decorative Background Rings -->
<div class="absolute inset-0 rounded-full border-[16px] border-surface-container-high opacity-20"></div>
<div class="absolute inset-4 rounded-full border border-outline-variant opacity-30 pulse-ring" style="animation-duration: 3s;"></div>
<div class="absolute inset-10 rounded-full border border-primary-fixed-dim opacity-40 pulse-ring"></div>
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="44" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary scan-progress" cx="50" cy="50" fill="none" id="progressCircle" r="44" stroke="currentColor" stroke-dasharray="276" stroke-dashoffset="69" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Center Content -->
<div class="relative z-10 flex flex-col items-center justify-center bg-surface-container-lowest rounded-full w-40 h-40 shadow-[0_8px_20px_rgba(0,0,0,0.1)] border border-surface-variant">
<span class="material-symbols-outlined text-4xl text-primary mb-1" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="text-headline-lg-mobile font-headline-lg-mobile text-primary" id="progressText">75%</span>
</div>
</section>
<!-- Live Data Tiles Grid -->
<section class="w-full grid grid-cols-2 gap-4 mb-xl">
<!-- Tile: RPM -->

</div>

</div>
</div>
<!-- Tile: Speed -->
<div class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-start gap-1 shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant">
<div class="flex items-center gap-2 text-on-surface-variant mb-2">
<span class="material-symbols-outlined text-[18px]">directions_car</span>

</div>

<div>

</div>
</div>
</div>
</div>

</button>

<span class="material-symbols-outlined text-2xl mb-1">build</span>
<span class="text-label-md font-label-md">Mechanics</span>
</button>
</nav>
<script>
        // Simple script to simulate scan progress
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('progressCircle');
            const text = document.getElementById('progressText');
            let progress = 75; // Starting value based on the prompt's visual state
            
            // Total circumference of r=44 is ~276
            const circumference = 276;
            
            // Function to update progress
            const updateProgress = (percent) => {
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;
                text.innerText = Math.round(percent) + '%';
            };
            
            // Initial set
            updateProgress(progress);
            
            // Optional: slowly increment to simulate ongoing scan if desired, 
            // kept static to match the design requested snapshot.
            /*
            setInterval(() => {
                if (progress < 99) {
                    progress += 0.5;
                    updateProgress(progress);
                }
            }, 500);
            */
        });
    </script>
