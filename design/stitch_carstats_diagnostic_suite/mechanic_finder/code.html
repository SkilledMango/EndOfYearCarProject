<script>
        // Simple bottom sheet interaction
        const sheet = document.getElementById('bottomSheet');
        const handle = document.getElementById('dragHandle');
        
        handle.addEventListener('click', () => {
            sheet.classList.toggle('expanded');
        });

        // Basic touch handling for the sheet
        let startY;
        let currentY;
        
        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            sheet.style.transition = 'none';
        }, {passive: true});

        handle.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if(diff > 0 && sheet.classList.contains('expanded')) {
                 sheet.style.transform = `translateY(${diff}px)`;
            } else if (diff < 0 && !sheet.classList.contains('expanded')) {
                 // allow drag up if not expanded, constrained
                 const maxDrag = document.body.clientHeight * 0.7 - 140; // approx max
                 sheet.style.transform = `translateY(calc(100% - 140px + ${Math.max(diff, -maxDrag)}px))`;
            }
        }, {passive: true});

        handle.addEventListener('touchend', (e) => {
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            sheet.style.transform = ''; // clear inline style to let class take over
            
            if(currentY > startY + 50) {
                sheet.classList.remove('expanded');
            } else if (currentY < startY - 50) {
                sheet.classList.add('expanded');
            }
        });
    </script>
