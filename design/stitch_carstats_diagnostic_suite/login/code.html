<!DOCTYPE html>

<html class="h-full bg-background antialiased" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CarStats - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#1353d8",
                        "on-primary-fixed": "#00174d",
                        "on-surface-variant": "#434654",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f3f3fe",
                        "secondary-container": "#6cf8bb",
                        "secondary-fixed": "#6ffbbe",
                        "tertiary-container": "#895600",
                        "surface-bright": "#faf8ff",
                        "tertiary": "#694100",
                        "on-surface": "#191b23",
                        "surface-variant": "#e2e1ed",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "on-tertiary-container": "#ffd6a8",
                        "on-tertiary-fixed": "#2a1700",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#1a56db",
                        "tertiary-fixed": "#ffddb8",
                        "on-primary-container": "#d4dcff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#003dab",
                        "on-tertiary-fixed-variant": "#653e00",
                        "error": "#ba1a1a",
                        "background": "#faf8ff",
                        "outline-variant": "#c3c5d7",
                        "surface-dim": "#d9d9e4",
                        "primary-fixed-dim": "#b5c4ff",
                        "surface-container-high": "#e7e7f3",
                        "on-secondary-fixed-variant": "#005236",
                        "on-background": "#191b23",
                        "inverse-on-surface": "#f0f0fb",
                        "secondary-fixed-dim": "#4edea3",
                        "primary": "#003fb1",
                        "surface": "#faf8ff",
                        "on-secondary-container": "#00714d",
                        "inverse-surface": "#2e3039",
                        "surface-container-highest": "#e2e1ed",
                        "on-error": "#ffffff",
                        "inverse-primary": "#b5c4ff",
                        "on-primary": "#ffffff",
                        "surface-container": "#ededf8",
                        "secondary": "#006c49"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "unit": "4px",
                        "container-padding": "20px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "card-gap": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full flex flex-col justify-center bg-surface-container md:bg-background px-container-padding">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    directions_car
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-xs">
                CarStats
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Understand your car's language.
            </p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant p-lg md:p-xl">
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">
                                mail
                            </span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">
                                lock
                            </span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-xs pb-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors font-semibold" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[56px] flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-[0_8px_20px_rgba(0,0,0,0.1)] font-headline-sm text-headline-sm text-on-primary bg-primary hover:bg-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-body-sm text-body-sm text-outline">Or continue with</span>
</div>
</div>
<div class="mt-md grid grid-cols-2 gap-3">
<button class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-lg bg-surface font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors items-center" type="button">
<span class="material-symbols-outlined text-[20px] mr-2">
                            login
                        </span>
                        Google
                    </button>
<button class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-lg bg-surface font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors items-center" type="button">
<span class="material-symbols-outlined text-[20px] mr-2">apps</span>
                        Apple
                    </button>
</div>
</div>
</div>
<!-- Footer Link -->
<p class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-semibold text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                Create one.
            </a>
</p>
</main>
</body></html>
